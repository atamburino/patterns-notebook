<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Mobile-first quick reference for C# and TypeScript coding patterns.">
  <meta name="theme-color" content="#f6f4ef" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#141311" media="(prefers-color-scheme: dark)">
  <title>Patterns notebook</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/site.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: "Patterns",
      nameLink: "/",
      loadSidebar: true,
      loadNavbar: true,
      mergeNavbar: true,
      subMaxLevel: 2,
      auto2top: true,
      executeScript: false,
      coverpage: false,
      alias: {
        "/.*/_sidebar.md": "/_sidebar.md",
        "/.*/_navbar.md": "/_navbar.md"
      },
      search: {
        maxAge: 86400000,
        paths: "auto",
        placeholder: "Search patterns",
        noData: "No matches",
        depth: 4
      },
      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var path = decodeURIComponent(location.hash.replace(/^#\/?/, "").split("?")[0]);
            var section = "home";
            if (path.indexOf("typescript") === 0) section = "ts";
            else if (path.indexOf("csharp") === 0) section = "cs";
            document.body.setAttribute("data-section", section);
          });
        }
      ]
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
</body>
</html>
